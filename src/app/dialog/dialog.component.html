    <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="closeDialog()"><i class="material-icons">clear</i></button>

<h2 mat-dialog-title *ngIf="title === undefined || title === null; else customTitle">{{ 'dialog.text' | translate }}</h2>
<ng-template #customTitle><h2 mat-dialog-title *ngIf="title !== ''">{{ title }}</h2></ng-template>
<mat-dialog-content >  
  <div [innerHtml]="content"></div>
</mat-dialog-content>
